name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Admin, Guest gallery, Venue screen, Uploads, Processing, Lifecycle, Infra]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 12, Safari 17
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.0
