<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Convidado · Enviar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D90F32}a:hover{color:#BE0E2E}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; color: #1F2430; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: {{accent}}; padding: 28px 20px 26px 20px; border-radius: 0 0 28px 28px; display: flex; align-items: flex-end; gap: 8px; position: relative">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px">
      <span style="align-self: flex-start; background: rgba(255,255,255,0.22); color: #FFFFFF; font-weight: 800; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px">Ao vivo agora</span>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.05; font-weight: 900; color: #FFFFFF">Ana &amp; Pedro</h1>
      <p style="margin: 0; font-size: 17px; font-weight: 800; color: #FFFFFF">Casamento · 15/11</p>
    </div>
    <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <div style="background: #FFFFFF; color: #1F2430; font-weight: 800; font-size: 13px; line-height: 1.25; padding: 8px 11px; border-radius: 14px 14px 4px 14px; max-width: 128px; border: 2px solid #1F2430">Bora registrar a festa?</div>
      <img src="/_blob/afd2ef34318924e0dd4e558e797d57a3" alt="" style="width: 92px; height: 72px; object-fit: contain">
    </div>
  </header>

  <main style="flex: 1 1 auto; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 18px">

    <section aria-label="Meta da festa" style="background: #FFF6D6; border: 2px solid #F2D27A; border-bottom-width: 5px; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 900; font-size: 16px; color: #5A4300">Meta da festa</span>
        <span style="font-weight: 900; font-size: 15px; color: #5A4300">128 / 200 fotos</span>
      </div>
      <div style="height: 16px; background: #FFFFFF; border-radius: 999px; border: 2px solid #F2D27A; overflow: hidden">
        <div style="width: 64%; height: 100%; background: #FFC800; border-radius: 999px"></div>
      </div>
    </section>

    <section aria-label="Enviar" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" style="height: 128px; border: 0; border-bottom: 6px solid #9E0A24; border-radius: 22px; background: #D90F32; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 900">
        <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
        Tirar foto
      </button>
      <button type="button" style="height: 128px; border: 0; border-bottom: 6px solid #C99A00; border-radius: 22px; background: #FFC800; color: #3B2A00; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 900">
        <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
        Gravar vídeo
      </button>
      <button type="button" style="grid-column: 1 / -1; height: 64px; border: 2px solid #E3E5EB; border-bottom-width: 6px; border-radius: 20px; background: #FFFFFF; color: #1F2430; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 900">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
        Escolher da galeria
      </button>
    </section>

    <section aria-label="Enviando" style="background: #F4F5F8; border: 2px solid #E3E5EB; border-bottom-width: 5px; border-radius: 18px; padding: 12px; display: flex; align-items: center; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 12px; background: #FFD7DE; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #9E0A24">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
      </div>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 7px; min-width: 0">
        <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 15px">
          <span>Vídeo 2</span><span style="color: #9E0A24">64%</span>
        </div>
        <div style="height: 12px; background: #FFFFFF; border-radius: 999px; overflow: hidden; border: 2px solid #E3E5EB">
          <div style="width: 64%; height: 100%; background: #D90F32; border-radius: 999px"></div>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #4B5263">Pode fechar a câmera, a gente continua enviando.</span>
      </div>
    </section>

    <section aria-label="Enviados por você" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 18px; font-weight: 900">Enviados por você</h2>
        <span style="font-size: 14px; font-weight: 800; color: #4B5263">3 envios</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <div style="height: 92px; border-radius: 16px; background: #CFE9FF; border: 2px solid #9CCBF2; border-bottom-width: 5px; position: relative">
          <span style="position: absolute; left: 6px; bottom: 6px; background: #FFFFFF; color: #0B5A2A; font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 999px; display: flex; align-items: center; gap: 3px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Na galeria</span>
        </div>
        <div style="height: 92px; border-radius: 16px; background: #FFE3B8; border: 2px solid #F2C27A; border-bottom-width: 5px; position: relative">
          <span style="position: absolute; left: 6px; bottom: 6px; background: #FFFFFF; color: #6B4300; font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 999px">Preparando</span>
        </div>
        <div style="height: 92px; border-radius: 16px; background: #FFD7DE; border: 2px solid #F3A6B4; border-bottom-width: 5px; position: relative">
          <span style="position: absolute; left: 6px; bottom: 6px; background: #FFFFFF; color: #9E0A24; font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 999px">Enviando</span>
        </div>
      </div>
    </section>
  </main>

  <nav aria-label="Navegação" style="flex: 0 0 auto; border-top: 2px solid #E3E5EB; background: #FFFFFF; padding: 8px 12px 14px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <button type="button" onClick="{{tab.pick}}" aria-current="{{tab.current}}" style="{{tab.style}}">
        <sc-if value="{{tab.isSend}}" hint-placeholder-val="{{ true }}">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M6.5 11.5L12 6l5.5 5.5"/><path d="M5 20h14"/></svg>
        </sc-if>
        <sc-if value="{{tab.isGallery}}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        </sc-if>
        <sc-if value="{{tab.isMine}}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        </sc-if>
        {{tab.label}}
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D90F32","options":["#D90F32","#1F6FEB","#0F7A55","#7A3FD1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'send' };
  }
  renderVals() {
    const defs = [
      { id: 'send', label: 'Enviar' },
      { id: 'gallery', label: 'Galeria' },
      { id: 'mine', label: 'Meus envios' }
    ];
    const base = 'height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 900; ';
    const tabs = defs.map((d) => {
      const on = this.state.tab === d.id;
      return {
        label: d.label,
        isSend: d.id === 'send',
        isGallery: d.id === 'gallery',
        isMine: d.id === 'mine',
        current: on ? 'page' : 'false',
        style: base + (on
          ? 'background: #FFE8EC; color: #9E0A24; border: 2px solid #F3A6B4;'
          : 'background: transparent; color: #4B5263; border: 2px solid transparent;'),
        pick: () => this.setState({ tab: d.id })
      };
    });
    return { accent: this.props.accent ?? '#D90F32', tabs };
  }
}
</script>
</body>
</html>
